server:
  port: 8080
  max-http-request-header-size: 16KB

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/machines?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:${MYSQL_USER:machines_dev}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:change_this_local_password}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  ml-base-url: ${ML_BASE_URL:http://localhost:8000}
  documents-dir: ${DOCUMENTS_DIR:../documents}
